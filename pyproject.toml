[project]
name = "hisaab-scout"
version = "0.1.0"
description = "Reads public web pages for Hisaab: imports an event from a link, checks the vendor on a bill, and mines app reviews for product research."
authors = [{ name = "kanugurajesh" }]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cachetools>=8.0.0",
    "fastapi>=0.162.5",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-dateutil>=4.0.0",
    "rapidfuzz>=3.14.6",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
scout-research = "scout.research.cli:main"

[project.optional-dependencies]
research = [
    "google-play-scraper>=1.2.7",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scout"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
