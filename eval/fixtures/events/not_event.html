<body><h1>Easy Pongal Recipe</h1><p>Wash 1 cup rice and 1/4 cup moong dal. Pressure cook for 4 whistles. Temper ghee, pepper, cumin, cashews and curry leaves. Serves 4. Cost about ₹120.</p></body></html>
